[workspace]
resolver = "2"
members = ["crates/midgard-core", "crates/midgard-config", "crates/midgard-db"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/Ehsan-saradar/midgard-rs"

[workspace.dependencies]
midgard-core = { path = "crates/midgard-core" }
midgard-config = { path = "crates/midgard-config" }
midgard-db = { path = "crates/midgard-db" }

anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
] }

[profile.release]
lto = "thin"
codegen-units = 1
